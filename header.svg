<svg width="900" height="170" viewBox="0 0 900 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="grad" x1="0" y1="0" x2="900" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1B69" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="170" fill="#0D0D0D"/>
  <rect width="900" height="170" fill="url(#grad)"/>

  <!-- Left accent line -->
  <rect x="0" y="0" width="3" height="170" fill="#7B2FBE"/>

  <!-- Hex decorations -->
  <polygon points="855,28 875,17 895,28 895,50 875,61 855,50"
           fill="none" stroke="#7B2FBE" stroke-width="1" opacity="0.5"/>
  <polygon points="825,48 840,39 855,48 855,66 840,75 825,66"
           fill="none" stroke="#7B2FBE" stroke-width="0.5" opacity="0.25"/>
  <polygon points="800,32 812,25 824,32 824,46 812,53 800,46"
           fill="none" stroke="#C084FC" stroke-width="0.4" opacity="0.15"/>

  <!-- Name -->
  <text x="40" y="72"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="38" font-weight="700"
        letter-spacing="2" fill="#E8E8E8">
    Komal Kakarla
  </text>

  <!-- Subtitle -->
  <text x="42" y="102"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="11" letter-spacing="4" fill="#7B2FBE">
    Security · Defense · Detection
  </text>

  <!-- Tagline -->
  <text x="43" y="128"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="10" letter-spacing="1.5" fill="#6B7280" font-style="italic">
    Isolated. Focused. Precise.
  </text>

  <!-- Callsign -->
  <text x="43" y="152"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="9.5" letter-spacing="0.8" fill="#4A3A6B" font-style="italic">
    "The callsign was Iso. The work speaks."
  </text>
</svg>
