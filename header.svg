<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1B69" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </linearGradient>
    <style>
      .val1 { animation: type1 0.6s steps(6,end) 0.5s both; }
      .val2 { animation: type1 0.6s steps(8,end) 1.4s both; }
      .val3 { animation: type1 0.6s steps(4,end) 2.3s both; }
      .cur1 { animation: blink 0.7s step-end 0.5s 4 normal; opacity:0; }
      .cur2 { animation: blink 0.7s step-end 1.4s 4 normal; opacity:0; }
      .cur3 { animation: blink 0.7s step-end 2.3s 4 normal; opacity:0; }
      @keyframes type1 { from { opacity:0; } to { opacity:1; } }
      @keyframes blink { 0%,100%{opacity:0} 50%{opacity:1} }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="#0D0D0D"/>
  <rect width="900" height="220" fill="url(#grad)"/>
  <rect x="0" y="0" width="3" height="220" fill="#7B2FBE"/>

  <!-- Hex decorations -->
  <polygon points="855,28 875,17 895,28 895,50 875,61 855,50" fill="none" stroke="#7B2FBE" stroke-width="1" opacity="0.5"/>
  <polygon points="825,48 840,39 855,48 855,66 840,75 825,66" fill="none" stroke="#7B2FBE" stroke-width="0.5" opacity="0.25"/>

  <!-- Name -->
  <text x="40" y="65" font-family="'Space Mono','Courier New',monospace" font-size="38" font-weight="700" letter-spacing="2" fill="#E8E8E8">Komal Kakarla</text>
  <line x1="40" y1="78" x2="560" y2="78" stroke="#2D1B69" stroke-width="0.8" opacity="0.8"/>

  <!-- Tagline + Callsign -->
  <text x="43" y="103" font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5" fill="#6B7280" font-style="italic">Isolated. Focused. Precise.</text>
  <text x="43" y="128" font-family="'Courier New',monospace" font-size="11" letter-spacing="1" fill="#C084FC" font-style="italic">"The callsign was Iso. The work speaks."</text>

  <!-- Terminal bar background -->
  <rect x="40" y="148" width="820" height="38" rx="4" fill="#0D0D0D" stroke="#2D1B69" stroke-width="0.8"/>

  <!-- status: -->
  <text x="58" y="172" font-family="'Courier New',monospace" font-size="11" fill="#6D28D9">&gt; status:</text>
  <text x="138" y="172" font-family="'Courier New',monospace" font-size="11" fill="#C084FC" class="val1">active</text>
  <text x="192" y="172" font-family="'Courier New',monospace" font-size="11" fill="#C084FC" class="cur1">_</text>

  <!-- divider 1 -->
  <line x1="330" y1="153" x2="330" y2="186" stroke="#2D1B69" stroke-width="0.8" opacity="0.8"/>

  <!-- target: -->
  <text x="348" y="172" font-family="'Courier New',monospace" font-size="11" fill="#6D28D9">&gt; target:</text>
  <text x="428" y="172" font-family="'Courier New',monospace" font-size="11" fill="#C084FC" class="val2">acquired</text>
  <text x="500" y="172" font-family="'Courier New',monospace" font-size="11" fill="#C084FC" class="cur2">_</text>

  <!-- divider 2 -->
  <line x1="620" y1="153" x2="620" y2="186" stroke="#2D1B69" stroke-width="0.8" opacity="0.8"/>

  <!-- noise: -->
  <text x="638" y="172" font-family="'Courier New',monospace" font-size="11" fill="#6D28D9">&gt; noise:</text>
  <text x="710" y="172" font-family="'Courier New',monospace" font-size="11" fill="#C084FC" class="val3">zero</text>
  <text x="738" y="172" font-family="'Courier New',monospace" font-size="11" fill="#C084FC" class="cur3">_</text>
</svg>
